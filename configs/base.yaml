binarizer:
  split:
    subdir: null
    count: 1000
    seed: 2026
  num_workers: 2
  features:
    audio_sample_rate: 48000
    hop_size: 480
    fft_size: 2048
    win_size: 2048
    spectrogram:
      type: mel
      num_bins: 80
      fmin: 0
      fmax: 8000

training:
  dataloader:
    max_concat_size: null
    max_concat_frames: null
    max_batch_size: 32
    max_batch_frames: 32000
    max_val_batch_size: 16
    max_val_batch_frames: 16000
    frame_count_grid: 6
    num_workers: 8
    prefetch_factor: 2
  augmentation:
    pitch_shifting:
      enabled: true
      prob: 0.5
      min_semitones: -12
      max_semitones: 12
    time_stretching:
      enabled: true
      prob: 0.5
      min_speed: 0.8
      max_speed: 1.25
    loudness_scaling:
      enabled: true
      prob: 0.5
      min_db: -6
      max_db: 6
    spectrogram_masking:
      enabled: true
      time_mask_prob: 0.10
      time_mask_max_width: 30
      freq_mask_prob: 0.05
      freq_mask_max_width: 15
      intersect_prob: 0.5
      max_repeats: 3
    colored_noise:
      enabled: true
      prob: 0.25
      min_exponent: 0
      max_exponent: 2
    natural_noise:
      enabled: true
      prob: 0.25
      max_repeats: 3
      noise_path_glob: "data/noise/**/*.wav"
    rir_reverb:
      enabled: true
      prob: 0.25
      kernel_path_glob: "data/reverb/**/*.wav"

  loss: {}
  optimizer:
    cls: torch.optim.AdamW
    kwargs:
      lr: 0.0002
      betas: [0.9, 0.98]
      weight_decay: 0
  lr_scheduler:
    cls: lib.lr_scheduler.scheduler.WarmupDecayingCosineAnnealingWarmRestarts
    kwargs:
      warmup_steps: 2000
      max_lr: 0.0005
      min_lr: 0.00001
      cycle_steps: 8000
      peak_decay: 0.8  # irrelevant with a single cycle
      cycle_mult: 1.0
      cycle_boundary: trough
    unit: "step"
  trainer:
    unit: "step"
    min_steps: 0
    max_steps: 80000
    min_epochs: 0
    max_epochs: 1000
    val_every_n_units: 2000
    log_every_n_steps: 100
    num_sanity_val_steps: 1
    checkpoints:
      - tag: "best"
        type: "expression"
        expression: "total_loss"
        save_top_k: 5
        mode: "min"
        weights_only: false
      - tag: "latest"
        type: "periodic"
        unit: "step"
        every_n_units: 2000
        since_m_units: 0
        save_last_k: 1
        weights_only: false
      - tag: "backup"
        type: "periodic"
        unit: "step"
        every_n_units: 10000
        since_m_units: 30000
        save_last_k: -1
        weights_only: false
    early_stopping: null
    precision: "bf16-mixed"
    accelerator: "auto"
    devices: "auto"
    num_nodes: 1
    strategy:
      name: "auto"
      kwargs:
        process_group_backend: nccl
        find_unused_parameters: true
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
  validation:
    allow_amp: false
    max_plots: 10
    parallel_dirty_metrics: true
  finetuning:
    pretraining_enabled: false
    pretraining_from: null
    pretraining_include_params: ["model.*"]
    pretraining_exclude_params: []
    freezing_enabled: false
    freezing_include_params: []
    freezing_exclude_params: []
  weight_averaging:
    ema_enabled: false
    ema_decay: 0.999
    ema_include_params: ["model.*"]
    ema_exclude_params: []

inference: {}
